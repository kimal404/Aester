name: Build & Package Aester Module

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Compile aesterctl (aarch64)
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-29 \
                -DCMAKE_BUILD_TYPE=Release \
                ..
          make -j$(nproc)
          file aesterctl

      - name: Assemble Flashable ZIP
        run: |
          mkdir -p module/bin dist
          cp build/aesterctl module/bin/
          chmod 755 module/bin/aesterctl
          
          cd module
          zip -r9 ../dist/aester-backend-1.0.0.zip . -x "bin/.keep"
          cd ..

      - name: Publish / Overwrite Continuous Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Buat atau timpa tag release 'nightly' dengan binary & zip terbaru
          gh release create nightly dist/aester-backend-1.0.0.zip build/aesterctl \
            --title "Continuous Build (Latest)" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --clobber || \
          gh release upload nightly dist/aester-backend-1.0.0.zip build/aesterctl --clobber
