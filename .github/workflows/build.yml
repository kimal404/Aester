name: Build & Package Aester Module

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Compile aesterctl (aarch64)
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-29 \
                -DCMAKE_BUILD_TYPE=Release \
                ..
          make -j$(nproc)
          file aesterctl

      - name: Assemble Flashable ZIP
        run: |
          mkdir -p module/bin dist
          cp build/aesterctl module/bin/
          chmod 755 module/bin/aesterctl
          
          cd module
          zip -r9 ../dist/aester-backend-1.0.0.zip . -x "bin/.keep"
          cd ..

      - name: Publish Continuous Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: "Continuous Build (Latest)"
          body: "Auto-built from commit ${{ github.sha }}"
          prerelease: true
          files: |
            dist/aester-backend-1.0.0.zip
            build/aesterctl
